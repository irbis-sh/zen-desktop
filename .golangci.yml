version: "2"

run:
  modules-download-mode: readonly
  timeout: 5m

linters:
  enable:
    - asciicheck
    - bidichk
    - gocritic
    - godot
    - gosec
    - importas
    - makezero
    - misspell
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
  disable:
    - errcheck
  settings:
    gosec:
      # G706 (log injection): too many false positives.
      excludes:
        - G706
      config:
        G302: "0644"
        G306: "0644"
    staticcheck:
      # The defaults, plus ST1020-ST1022: a doc comment starts with the name it documents.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016"]
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - (^|/)node_modules/
    rules:
      # Doc comments are checked for form by staticcheck, and are not required to exist.
      - linters:
          - revive
        text: should have comment|should have a package comment|should be of the form
      - linters:
          # These give false positives for Windows API-related identifier names.
          - revive
          - staticcheck
        path: (.+)_windows.go

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
