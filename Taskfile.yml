version: '3'

includes:
  build: tasks/build/Taskfile-{{OS}}.yml
  frontend: frontend/Taskfile.yml
  scriptlets: jslibs/scriptlets/Taskfile.yml
  extended-css: jslibs/extended-css/Taskfile.yml

tasks:
  default:
    desc: Runs the dev task.
    cmds:
      - task: dev

  dev:
    desc: Runs the application in development mode.
    cmds:
      - wails dev -tags webkit2_41

  build-dev:
    desc: Create a development build of the application.
    cmds:
      - wails build -tags webkit2_41

  test-go:
    desc: Run Go tests.
    cmds:
      # No -cover: combined with -race it makes the internal/ruletree tests about 9 times slower.
      - go test -race ./...

  test:
    desc: Run Go, scriptlets, and extended-css tests.
    cmds:
      - task: scriptlets:test
      - task: extended-css:test
      - task: test-go
      - cmd: echo "Tests passed"
        silent: true

  lint:
    desc: Run frontend, scriptlets, extended-css, and Go linters.
    cmds:
      - task: frontend:lint
      - task: scriptlets:lint
      - task: extended-css:lint
      - task: lint-go
      - cmd: echo "Checks passed"
        silent: true

  lint-go:
    desc: Run Go linters.
    cmds:
      - golangci-lint run

  fmt-go:
    desc: Run go fmt on improperly formatted Go files.
    cmds:
      - golangci-lint fmt

  pull-exclusions:
    desc: Pull the updates from the zen-https-exclusions repository.
    cmds:
      - git subtree pull --prefix=internal/sysproxy/exclusions https://github.com/irbis-sh/zen-https-exclusions master --squash

  update-flake:
    desc: Update the nixpkgs input in flake.lock. Runs Nix in Docker when it is not installed.
    # Mounting only the flake files avoids copying the whole checkout, node_modules
    # included, into the Nix store, and works in git worktrees, whose .git points
    # outside the mount. :z relabels the files so the container can access them under SELinux.
    cmds:
      - |
        if command -v nix >/dev/null; then
          nix --extra-experimental-features 'nix-command flakes' flake update nixpkgs
        else
          docker run --rm -v "$PWD/flake.nix:/src/flake.nix:ro,z" -v "$PWD/flake.lock:/src/flake.lock:z" \
            nixos/nix:2.35.2 nix --extra-experimental-features 'nix-command flakes' flake update nixpkgs --flake path:/src
        fi
